name: Build racinglegends_v2.dol
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make 2>&1 | tee build.log
          if [ ! -f boot.dol ]; then
            # surface the compiler errors as an annotation (one message, newlines encoded)
            msg=$(grep -E -B2 -A3 "error|undefined reference" build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi
          w=$(grep -E "warning" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          [ -n "$w" ] && echo "::warning title=Compiler warnings::$w" || true
      - run: $DEVKITPPC/bin/powerpc-eabi-size boot.elf | tee -a build.log
      - run: cp boot.dol racinglegends_v2.dol
      - uses: actions/upload-artifact@v4
        with:
          name: racing-legends-wii
          path: |
            racinglegends_v2.dol
            build.log
            apps/
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racing-legends-wii
      - name: Publish the v2 download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v2 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RACING LEGENDS v2" --notes "Open racinglegends_v2.dol in Dolphin (Classic Controller), or copy apps/racinglegends to an SD card."
          gh release upload v2 racinglegends_v2.dol build.log -R "$GITHUB_REPOSITORY" --clobber
